# Logrotate configuration for OmniRoute logs
# Install: sudo cp config/logrotate.conf /etc/logrotate.d/omniroute
# Or run manually: logrotate -f config/logrotate.conf

/home/creator/PROJECTS/free-ai-aggregator/OmniRoute/logs/application/*.log {
    daily
    rotate 3
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    create 0644 creator creator
    dateext
    dateformat -%Y%m%d
    
    # Post-rotation script
    postrotate
        # Signal OmniRoute to reopen log files if needed
        docker exec omniroute kill -USR1 1 2>/dev/null || true
    endscript
}

# Docker container logs (JSON files)
/var/lib/docker/containers/*/*.log {
    daily
    rotate 3
    maxsize 10M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
