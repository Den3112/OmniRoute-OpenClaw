# Crontab configuration for free-ai-aggregator maintenance
# Install: crontab -e, then add these lines
# Or: crontab config/crontab.conf

# Daily cleanup at 2 AM
0 2 * * * /home/creator/PROJECTS/free-ai-aggregator/scripts/maintenance/auto-cleanup.sh >> /home/creator/PROJECTS/free-ai-aggregator/data/cron.log 2>&1

# Weekly database backup cleanup (Sundays at 3 AM)
0 3 * * 0 find /home/creator/PROJECTS/free-ai-aggregator/data/omniroute/db_backups -name "*.sqlite" -mtime +7 -delete

# Monthly git optimization (1st of month at 4 AM)
0 4 1 * * cd /home/creator/PROJECTS/free-ai-aggregator && git gc --auto

# Daily Docker cleanup (unused images/containers at 3 AM)
0 3 * * * docker system prune -f --filter "until=168h" >> /home/creator/PROJECTS/free-ai-aggregator/data/docker-cleanup.log 2>&1

# Weekly full backup (Sundays at 1 AM)
0 1 * * 0 /home/creator/PROJECTS/free-ai-aggregator/scripts/maintenance/backup.sh

# Health check every 5 minutes (optional)
# */5 * * * * /home/creator/PROJECTS/free-ai-aggregator/scripts/operations/healthcheck.sh >> /home/creator/PROJECTS/free-ai-aggregator/data/health.log 2>&1
