services:
  omniroute:
    build:
      context: ./OmniRoute
      target: runner-cli
    container_name: omniroute
    ports:
      - "20128:20128"
    volumes:
      - /home/creator/.omniroute:/app/data
    environment:
      - NODE_ENV=production
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-admin}
      - OMNIROUTE_DISABLE_TOKEN_HEALTHCHECK=${OMNIROUTE_DISABLE_TOKEN_HEALTHCHECK:-false}
      - OMNIROUTE_HIDE_HEALTHCHECK_LOGS=${OMNIROUTE_HIDE_HEALTHCHECK_LOGS:-false}
      - APP_LOG_TO_FILE=true
    networks:
      - ai_network
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:20128/api/monitoring/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  openclaw:
    build:
      context: ./openclaw
      args:
        - OPENCLAW_INSTALL_DOCKER_CLI=1
        - OPENCLAW_INSTALL_BROWSER=0
    container_name: openclaw
    ports:
      - "18789:18789"
    volumes:
      - /home/creator/.openclaw:/home/node/.openclaw
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured", "--auth", "token", "--token", "${OPENCLAW_PASSWORD:-admin}", "--bind", "lan"]
    environment:
      - NODE_ENV=production
      - HOME=/home/node
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_PASSWORD=${OPENCLAW_PASSWORD}
      - ANTHROPIC_BASE_URL=http://omniroute:20128/v1
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-sk-omniroute-any-key}
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    depends_on:
      omniroute:
        condition: service_healthy
    networks:
      - ai_network
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    shm_size: '2gb'
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:18789/healthz').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 45s
      timeout: 15s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omniroute-redis
    command: redis-server --save "" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - ai_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ai_network:
    driver: bridge

volumes:
  redis_data:
