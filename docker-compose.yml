version: '3.8'

services:
  omniroute:
    build:
      context: ./OmniRoute
      target: runner-base
    container_name: omniroute
    ports:
      - "20128:20128"
    volumes:
      - omniroute_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-admin}
      - APP_LOG_TO_FILE=true
    networks:
      - ai_network
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  openclaw:
    build:
      context: ./openclaw
      args:
        - OPENCLAW_INSTALL_DOCKER_CLI=1
        - OPENCLAW_INSTALL_BROWSER=0
    container_name: openclaw
    ports:
      - "18789:18789"
    volumes:
      - openclaw_data:/home/node/.openclaw
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured", "--auth", "password", "--password", "${OPENCLAW_PASSWORD}", "--bind", "lan"]
    environment:
      - NODE_ENV=production
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_PASSWORD=${OPENCLAW_PASSWORD}
      - ANTHROPIC_BASE_URL=http://omniroute:20128/v1
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-sk-omniroute-any-key}
    depends_on:
      omniroute:
        condition: service_healthy
    networks:
      - ai_network
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:18789/healthz').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: omniroute-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - ai_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ai_network:
    driver: bridge

volumes:
  omniroute_data:
  openclaw_data:
  redis_data:
