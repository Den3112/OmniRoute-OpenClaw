version: '3.8'

services:
  omniroute:
    image: ghcr.io/${DOCKER_ORG:-den3112}/omniroute:latest
    build:
      context: ./OmniRoute
      target: runner-cli
      cache_from:
        - type=local,src=/tmp/docker-cache/omniroute
        - type=registry,ref=ghcr.io/${DOCKER_ORG:-den3112}/omniroute:latest
      cache_to:
        - type=local,dest=/tmp/docker-cache/omniroute,mode=max
    container_name: omniroute
    ports:
      - "${PORT:-20128}:20128"
    volumes:
      - ./data/omniroute:/app/data
    environment:
      - NODE_ENV=production
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://redis:6379?socket_keepalive=true&socket_timeout=5000&connect_timeout=10000&max_retries=3&retry_delay=100
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-admin}
      - DATA_DIR=/app/data
      - OMNIROUTE_BOOTSTRAPPED=true
      - OMNIROUTE_DISABLE_TOKEN_HEALTHCHECK=${OMNIROUTE_DISABLE_TOKEN_HEALTHCHECK:-false}
      - OMNIROUTE_HIDE_HEALTHCHECK_LOGS=${OMNIROUTE_HIDE_HEALTHCHECK_LOGS:-false}
      - APP_LOG_TO_FILE=true
      - SEMANTIC_CACHE_DEFAULT_TEMPERATURE=${SEMANTIC_CACHE_DEFAULT_TEMPERATURE:-true}
      - NODE_OPTIONS=--max-old-space-size=1536 --max-semi-space-size=64
      - UV_THREADPOOL_SIZE=16
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
    networks:
      - ai_network
    restart: always
    init: true
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:20128/api/monitoring/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy

  openclaw:
    image: ghcr.io/${DOCKER_ORG:-den3112}/openclaw:latest
    build:
      context: ./openclaw
      args:
        - OPENCLAW_INSTALL_DOCKER_CLI=1
        - OPENCLAW_INSTALL_BROWSER=0
      cache_from:
        - type=local,src=/tmp/docker-cache/openclaw
        - type=registry,ref=ghcr.io/${DOCKER_ORG:-den3112}/openclaw:latest
      cache_to:
        - type=local,dest=/tmp/docker-cache/openclaw,mode=max
    container_name: openclaw
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured", "--auth", "token", "--token", "${OPENCLAW_PASSWORD:-admin}", "--bind", "lan"]
    environment:
      - NODE_ENV=production
      - HOME=/home/node
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_PASSWORD=${OPENCLAW_PASSWORD}
      - ANTHROPIC_BASE_URL=http://omniroute:20128/v1
      - ANTHROPIC_API_KEY=${OMNIROUTE_API_KEY:-sk-omniroute-any-key}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-sk-omniroute-any-key}
      - OPENCLAW_DATA_DIR=/home/node/.openclaw
      - UV_THREADPOOL_SIZE=16
      - NODE_OPTIONS=--max-old-space-size=3072
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    depends_on:
      omniroute:
        condition: service_healthy
    networks:
      - ai_network
    restart: always
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    shm_size: '512mb'
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:18789/healthz').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 45s
      timeout: 15s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omniroute-redis
    command: redis-server --save "" --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-keepalive 300 --timeout 0 --tcp-backlog 511 --io-threads 4 --io-threads-do-reads yes --lazyfree-lazy-eviction yes --lazyfree-lazy-expire yes
    volumes:
      - redis_data:/data
    networks:
      - ai_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: omniroute-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - ai_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    profiles:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: omniroute-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=redis-datasource
    networks:
      - ai_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # Redis Exporter for Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: omniroute-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - ai_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      - redis
    profiles:
      - monitoring

networks:
  ai_network:
    driver: bridge

volumes:
  redis_data:
  npm_cache:
  pnpm_cache:
  prometheus_data:
  grafana_data:
