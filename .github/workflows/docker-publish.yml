name: Docker Build & Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_OMNI: ${{ github.repository_owner }}/omniroute
  IMAGE_NAME_OPENCLAW: ${{ github.repository_owner }}/openclaw

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build OmniRoute
      - name: Build and push OmniRoute
        uses: docker/build-push-action@v5
        with:
          context: ./OmniRoute
          target: runner-cli
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_OMNI }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build OpenClaw
      - name: Build and push OpenClaw
        uses: docker/build-push-action@v5
        with:
          context: ./openclaw
          build-args: |
            OPENCLAW_INSTALL_DOCKER_CLI=1
            OPENCLAW_INSTALL_BROWSER=0
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_OPENCLAW }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
