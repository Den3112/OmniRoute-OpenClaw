name: Docker Build & Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - 'OmniRoute/**'
      - 'openclaw/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_OMNI: ${{ github.repository_owner }}/omniroute
  IMAGE_NAME_OPENCLAW: ${{ github.repository_owner }}/openclaw

jobs:
  build-omniroute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for OmniRoute
        id: meta-omni
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_OMNI }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{date 'YYYYMMDD'}}-

      - name: Build and push OmniRoute
        uses: docker/build-push-action@v5
        with:
          context: ./OmniRoute
          target: runner-cli
          push: true
          tags: ${{ steps.meta-omni.outputs.tags }}
          labels: ${{ steps.meta-omni.outputs.labels }}
          cache-from: type=gha,scope=omniroute
          cache-to: type=gha,mode=max,scope=omniroute
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-openclaw:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for OpenClaw
        id: meta-openclaw
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_OPENCLAW }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{date 'YYYYMMDD'}}-

      - name: Build and push OpenClaw
        uses: docker/build-push-action@v5
        with:
          context: ./openclaw
          push: true
          tags: ${{ steps.meta-openclaw.outputs.tags }}
          labels: ${{ steps.meta-openclaw.outputs.labels }}
          cache-from: type=gha,scope=openclaw
          cache-to: type=gha,mode=max,scope=openclaw
          build-args: |
            OPENCLAW_INSTALL_DOCKER_CLI=1
            OPENCLAW_INSTALL_BROWSER=0
            BUILDKIT_INLINE_CACHE=1
